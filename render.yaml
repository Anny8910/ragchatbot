# Render Blueprint. Applied by "New → Blueprint" in the dashboard, or by
# pushing this file to the default branch of the connected repository.
#
# On instance size, because the obvious assumption here is wrong:
#
#   free     512 MB   $0/mo    spins down after inactivity
#   starter  512 MB   $7/mo    no spin-down
#   standard 2 GB     $25/mo
#
# Starter is the SAME 512 MB as free, so upgrading to it does not buy memory --
# it buys uptime. Measured peak RSS for this service is ~386 MB (interpreter,
# torch, sentence-transformers, the Chroma client, and four retrievals over the
# committed 45-chunk index), which leaves roughly 125 MB of headroom against a
# 512 MB cgroup limit. Enough to work; not enough to be confident.
#
# `plan: starter` is therefore the floor, not the recommendation. If the service
# is OOM-killed during or just after the first question, the fix is `standard`:
# there is no intermediate step.
#
# GROQ_API_KEY is NOT set here and must not be. Blueprint values are committed.
# Set it in the dashboard (Service → Environment), or let Render pick it up from
# a secret store. The app fails at start-up without it, by design:
# `GroqProvider.__init__` raises a named error rather than deferring to the
# first request.

services:
  - type: web
    name: ragchatbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    # The container builds its own index and starts Streamlit; there is nothing
    # to migrate, so the service is stateless and safe to restart at any time.
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      # The app reads RAG_* from the environment with the same names it uses
      # locally, so a value set here behaves identically to one in .env.
      - key: RAG_PROVIDER
        value: groq
      - key: RAG_LLM_MODEL
        value: openai/gpt-oss-120b
      - key: RAG_EMBED_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RAG_MIN_SCORE
        value: "0.35"
      - key: RAG_TOP_K
        value: "3"
      - key: RAG_MAX_SENTENCES
        value: "3"
      # No HF_TOKEN: the embedder is only needed at build time, inside the image,
      # so the running service never calls the Hub.
      - key: RAG_PII_REDACT
        value: "true"
      - key: RAG_TRIAGE_LLM
        value: "true"
      - key: RAG_LOG_TRACE
        value: "true"
