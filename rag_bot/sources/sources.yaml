# Source registry for the mutual-fund FAQ assistant.
#
# Publisher note: all five sources are source_tier "brief" because the URLs come
# from the problem statement, and they sit on groww.in, a broker rather than the
# AMC or a regulator. PRD open question Q1 asked whether that is acceptable; it
# was RESOLVED 2026-09-27 as YES, on the grounds that Groww is a regulated broker
# publishing standardised scheme data rather than the third-party commentary the
# brief's ban targets. The tier stays "brief" so that no row is ever presented as
# an official AMC/SEBI/AMFI document, and every row discloses its publisher. Any
# genuine AMC/SEBI/AMFI page added later uses source_tier "official_ref".
# See docs/PRD.md section 4 and docs/data-findings.md.

sources:
  - source_id: hdfc_large_cap_growth
    # Brief URL. Verified 200 on 2026-09-27.
    url: https://groww.in/mutual-funds/hdfc-large-cap-fund-direct-growth
    publisher: groww.in
    source_tier: brief
    scheme_id: S1
    scheme_name: "HDFC Large Cap Fund – Direct Growth"
    # Class-D link. RESOLVED 2026-09-27: no factsheet PDF exists on any of the
    # five groww pages (brochure_link is null, zero PDF links), so the link is
    # the AMC's own factsheet page instead of a PDF.
    #
    #   https://www.hdfcfund.com/mutual-funds/factsheets
    #
    # It is the official publisher, it is not month-stamped (the per-scheme PDFs
    # are "Fund Facts - <Scheme>_July 26.pdf" and would rot), and it is where
    # returns legitimately live. That is the point: the corpus deliberately
    # contains zero returns, so a class-D refusal that hands the user the
    # official performance document is honest rather than merely evasive.
    #
    # VERIFICATION CAVEAT: an automated fetch of that URL returns HTTP 403 (AMC
    # bot protection), not 200. Existence was confirmed from the search index,
    # which returned the page's real content. A browser opens it normally. Per
    # the P1 lesson, an unverified status is recorded as unverified rather than
    # asserted as 200. sid_url (https://www.hdfcfund.com) remains the
    # corpus-verified fallback.
    factsheet_url: https://www.hdfcfund.com/mutual-funds/factsheets
    # "large cap" alone is EXCLUDED: it is this scheme's category label.
    aliases: ["hdfc large cap fund", "large cap fund", "hdfc large cap", "hdfc large cap fund direct growth", "s1"]

  - source_id: hdfc_equity_growth
    # Brief URL. Verified 200 on 2026-09-27.
    url: https://groww.in/mutual-funds/hdfc-equity-fund-direct-growth
    publisher: groww.in
    source_tier: brief
    scheme_id: S2
    # The brief and PRD §4 call this "HDFC Equity Fund". That is the fund's
    # former name. As fetched on 2026-09-27 the live page reports
    #   fund_name     "HDFC Flexi Cap Direct Plan-Growth"
    #   sub_category  "Flexi Cap"
    # so HDFC has rebranded it. The brief's name is kept here for traceability
    # to the source document, and the note below records the current name.
    scheme_name: "HDFC Equity Fund – Direct Growth"
    # Class-D link: the AMC's own factsheet page. Full rationale and the
    # 403 verification caveat are on the first source.
    factsheet_url: https://www.hdfcfund.com/mutual-funds/factsheets
    # Aliases cover BOTH names, because a user may use either the current
    # official name or the older one the brief uses.
    #
    # "equity" alone is EXCLUDED per architecture §14.4: it is not S2's category,
    # but it appears in S1's and S4's category labels ("Equity Large Cap",
    # "Equity Small Cap"), so it would be ambiguous. "equity fund" is safe
    # because no other scheme is named "* Equity Fund".
    #
    # "flexi cap" alone is EXCLUDED: it is now S2's own sub_category label, so
    # it is a bare category word. "flexi cap fund" is kept because it is the
    # current official name and users do say it.
    aliases: ["hdfc equity fund", "equity fund", "hdfc equity", "hdfc equity fund direct growth", "hdfc flexi cap fund", "flexi cap fund", "hdfc flexi cap", "flexi cap direct plan growth", "s2"]

  - source_id: hdfc_elss_tax_saver_growth
    # Brief URL. Verified 200 on 2026-09-27.
    url: https://groww.in/mutual-funds/hdfc-elss-tax-saver-fund-direct-plan-growth
    publisher: groww.in
    source_tier: brief
    scheme_id: S3
    scheme_name: "HDFC ELSS Tax Saver Fund – Direct Growth"
    # Class-D link: the AMC's own factsheet page. Full rationale and the
    # 403 verification caveat are on the first source.
    factsheet_url: https://www.hdfcfund.com/mutual-funds/factsheets
    # S3 is the only ELSS scheme here, so "elss" is unambiguous on its own and
    # is the phrasing users actually use. "tax saver fund" is equally distinctive.
    aliases: ["hdfc elss tax saver fund", "hdfc elss", "elss tax saver fund", "tax saver fund", "hdfc tax saver fund", "elss", "s3"]

  - source_id: hdfc_small_cap_growth
    # Brief URL. Verified 200 on 2026-09-27.
    url: https://groww.in/mutual-funds/hdfc-small-cap-fund-direct-growth
    publisher: groww.in
    source_tier: brief
    scheme_id: S4
    scheme_name: "HDFC Small Cap Fund – Direct Growth"
    # Class-D link: the AMC's own factsheet page. Full rationale and the
    # 403 verification caveat are on the first source.
    factsheet_url: https://www.hdfcfund.com/mutual-funds/factsheets
    # "small cap" alone is EXCLUDED: it is this scheme's category label.
    aliases: ["hdfc small cap fund", "small cap fund", "hdfc small cap", "hdfc small cap fund direct growth", "s4"]

  - source_id: hdfc_balanced_advantage_growth
    # DEVIATION: the brief's URL is
    #   .../hdfc-balanced-advantage-fund-direct-plan-growth
    # which returns HTTP 404. The brief appears to have copied S3's
    # "-direct-plan-" suffix onto S5, which has no "-plan-" slug. The working URL
    # below was confirmed twice: by direct fetch, and via Groww's own search
    # endpoint. See docs/data-findings.md section 1.
    url: https://groww.in/mutual-funds/hdfc-balanced-advantage-fund-direct-growth
    publisher: groww.in
    source_tier: brief
    scheme_id: S5
    scheme_name: "HDFC Balanced Advantage Fund – Direct Growth"
    # Class-D link: the AMC's own factsheet page. Full rationale and the
    # 403 verification caveat are on the first source.
    factsheet_url: https://www.hdfcfund.com/mutual-funds/factsheets
    # "balanced advantage" alone is EXCLUDED: it is this scheme's category label
    # ("Hybrid Balanced Advantage"). "balanced advantage fund" is safe.
    aliases: ["hdfc balanced advantage fund", "balanced advantage fund", "hdfc balanced advantage", "hdfc balanced advantage fund direct growth", "s5"]
